<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OWDC Admin - Control Panel</title>
<style>body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:16px}h1{color:#d4af37;font-size:20px}.sub{color:#00ff88;font-size:12px;margin-top:4px}input{padding:12px;border-radius:8px;border:1px solid #333;background:#222;color:#fff;width:100%;margin-top:10px;font-size:13px}.btn{background:linear-gradient(135deg,#d4af37,#00ff88);color:#000;padding:13px;border-radius:10px;font-weight:900;cursor:pointer;text-align:center;margin-top:10px;border:none;width:100%}.card{background:#151515;padding:14px;border-radius:12px;margin-top:12px;border:1px solid #222}.userCard{background:#1a1a1a;padding:12px;border-radius:10px;margin-top:10px;border:1px solid #333}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.actions button{padding:8px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:800;font-size:11px;flex:1;min-width:70px}.stat{font-size:11px;color:#888}</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head><body>
<h1>🌍 OWDC Admin Panel</h1>
<div class="sub">100 OWDC=$1 • 50/DAY=$0.50 • Control Users • Add/Subtract</div>

<div class="card">
<div style="font-weight:900;font-size:13px">🔧 MANUAL CONTROL - Add/Subtract Any User</div>
<input id="manualCode" placeholder="User code e.g. OWDC4829">
<input id="manualAmount" type="number" placeholder="Amount e.g. 100">
<div style="display:flex;gap:6px;margin-top:10px">
<button class="btn" style="flex:1" onclick="manualControl('add')">➕ ADD</button>
<button class="btn" style="flex:1;background:linear-gradient(135deg,#ffcc00,#ff8800)" onclick="manualControl('sub')">➖ SUBTRACT</button>
<button class="btn" style="flex:1;background:linear-gradient(135deg,#ff4444,#ff8888);color:#fff" onclick="manualControl('set')">💰 SET</button>
</div>
</div>

<div class="card">
<div style="font-weight:900">🔐 Login</div>
<input id="pass" type="password" placeholder="Password: 8163172077">
<div class="btn" onclick="login()">Login Admin</div>
</div>

<div id="panel" style="display:none">
<div class="card">
<input id="search" placeholder="Search code e.g. OWDC1234" oninput="filterUsers()">
<div style="margin-top:10px;font-size:12px">Total Users: <b id="count">0</b> • Total OWDC: <b id="total">0</b> • USDT: <b id="totalUsd">$0</b></div>
</div>
<div id="users"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCT3h4cbRMAymvbDj5icsjLiqwdwu8g-gE",
  authDomain: "odwc-app.firebaseapp.com",
  databaseURL: "https://odwc-app-default-rtdb.firebaseio.com",
  projectId: "odwc-app",
  storageBucket: "odwc-app.firebasestorage.app",
  messagingSenderId: "941894038157",
  appId: "1:941894038157:web:0a3885c169b7faa70b68c4",
  measurementId: "G-8YF2X50C7X"
};
let db=null;let allUsers=[];const ADMIN_PASS="8163172077";const USD_PER=0.01;
firebase.initializeApp(firebaseConfig);db=firebase.database();

function login(){
  if(document.getElementById('pass').value===ADMIN_PASS){
    document.getElementById('panel').style.display='block';
    loadUsers();
  } else {alert('Wrong password');}
}
function loadUsers(){
  db.ref('users').on('value',snap=>{
    allUsers=[];let total=0;
    if(!snap.exists()){document.getElementById('users').innerHTML='<div class="card">No users yet. Open user app https://dejay-30.github.io/OWDC/ and mine 5 sec, then refresh here.</div>';document.getElementById('count').innerText='0';document.getElementById('total').innerText='0';document.getElementById('totalUsd').innerText='$0';return;}
    snap.forEach(child=>{let u=child.val();u.key=child.key;allUsers.push(u);total+=parseFloat(u.balance||0);});
    document.getElementById('count').innerText=allUsers.length;
    document.getElementById('total').innerText=total.toFixed(2);
    document.getElementById('totalUsd').innerText='$'+(total*USD_PER).toFixed(2);
    renderUsers(allUsers);
  });
}
function renderUsers(list){
  if(list.length===0){document.getElementById('users').innerHTML='<div class="card">No matching users</div>';return;}
  let html='';
  list.forEach(u=>{
    html+=`<div class="userCard">
      <div><b style="color:#d4af37">${u.code}</b><br>
      <span style="font-size:13px">${(u.balance||0).toFixed(2)} OWDC = $${((u.balance||0)*USD_PER).toFixed(2)} • Refs:${u.refs||0} • WC:${u.wc||0}</span><br>
      <span class="stat">${u.wallet||'No wallet'} • ${u.lastSeen?new Date(u.lastSeen).toLocaleString():''}</span></div>
      <div class="actions">
        <button style="background:#00ff88;color:#000" onclick="changeBalance('${u.key}',${u.balance||0},100)">+100 OWDC<br><span style="font-size:8px">$1</span></button>
        <button style="background:#00ccff;color:#fff" onclick="changeBalance('${u.key}',${u.balance||0},500)">+500<br>$5</button>
        <button style="background:#ffcc00;color:#000" onclick="changeBalance('${u.key}',${u.balance||0},-100)">-100</button>
        <button style="background:#ff4444;color:#fff" onclick="setBalance('${u.key}',0)">RESET 0</button>
        <button style="background:#0088cc;color:#fff" onclick="window.open('https://t.me/+2348163172077?text=Hi ${u.code} your balance is ${(u.balance||0).toFixed(2)}','_blank')">✈️ TELEGRAM CHAT</button>
        <button style="background:#222;color:#fff;border:1px solid #444" onclick="setBalance('${u.key}',500)">SET 500=$5</button>
      </div>
    </div>`;
  });
  document.getElementById('users').innerHTML=html;
}
function filterUsers(){let q=document.getElementById('search').value.toLowerCase();let f=allUsers.filter(u=>u.code.toLowerCase().includes(q));renderUsers(f);}
function changeBalance(key,current,delta){let newBal=current+delta;if(newBal<0)newBal=0;db.ref('users/'+key).update({balance:newBal,adminSet:true});alert('Updated '+key+' to '+newBal.toFixed(2)+' OWDC');}
function setBalance(key,newBal){let v=prompt('Set new balance for '+key+' (OWDC):',newBal);if(v===null)return;newBal=parseFloat(v);db.ref('users/'+key).update({balance:newBal,adminSet:true});alert('Set '+key+' to '+newBal);}
function manualControl(type){
  let code=document.getElementById('manualCode').value.trim().toUpperCase();
  let amount=parseFloat(document.getElementById('manualAmount').value);
  if(!code||isNaN(amount)){alert('Enter code and amount');return;}
  db.ref('users/'+code).once('value').then(snap=>{
    let current=0;if(snap.exists()){current=snap.val().balance||0;}
    let newBal=type==='add'?current+amount:type==='sub'?current-amount:amount;
    if(newBal<0)newBal=0;
    db.ref('users/'+code).update({code:code,balance:newBal,adminSet:true,manual:true,lastSeen:Date.now()});
    alert('✅ '+code+': '+current.toFixed(2)+' → '+newBal.toFixed(2)+' OWDC');
  });
}
</script></body></html>
